services:
  - type: web
    name: gopratle-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # set this manually in Render dashboard — MongoDB Atlas URI
      - key: FRONTEND_URL
        sync: false          # set to your Vercel deployment URL, e.g. https://gopratle.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 30
